app.name=ClassRevive
about.text=Versão {0}. Recupera Java legível de arquivos .jar e .class com quatro descompiladores, recompila o resultado e mostra o quanto cada classe é confiável. O programa analisado nunca é executado: as classes dele são lidas como dados e nunca inicializadas. ClassRevive License 1.0; as bibliotecas incluídas mantêm suas próprias licenças (veja THIRD_PARTY_NOTICES.md).

