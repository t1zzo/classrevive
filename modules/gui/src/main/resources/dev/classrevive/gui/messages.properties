app.name=ClassRevive
about.text=Version {0}. Recovers readable Java from .jar and .class files with four decompilers, recompiles the result and shows how far each class can be trusted. The analyzed program is never executed: its classes are read as data and never initialized. ClassRevive License 1.0; bundled libraries keep their own licenses (see THIRD_PARTY_NOTICES.md).

